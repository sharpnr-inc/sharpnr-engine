basePath: /api/v1
definitions:
  orchestrator_dtos.CreatePropertyReq_dto:
    properties:
      address_line:
        type: string
      city:
        type: string
      code:
        type: string
      country:
        type: string
      name:
        type: string
      pincode:
        type: string
      state:
        type: string
    type: object
  orchestrator_dtos.ListAllInfraOfProperty_Res_dto:
    properties:
      infrastructures:
        items:
          $ref: '#/definitions/orchestrator_dtos.PropertyInfra_res_dto'
        type: array
      property_id:
        type: string
    type: object
  orchestrator_dtos.ModuleOperationResult:
    properties:
      created:
        items:
          type: string
        type: array
      message:
        type: string
      skipped:
        items:
          type: string
        type: array
    type: object
  orchestrator_dtos.PropertyInfra_res_dto:
    properties:
      id:
        type: string
      infra_type:
        type: string
      name:
        type: string
      status:
        type: boolean
    type: object
  orchestrator_dtos.PropertyInfraConfiguration:
    properties:
      infra_name:
        type: string
      qty:
        type: integer
    type: object
  orchestrator_dtos.PropertyModuleConfigurationDTO:
    properties:
      domain:
        $ref: '#/definitions/property_constants.PropertyDomainTypes'
      infrastructure:
        items:
          $ref: '#/definitions/orchestrator_dtos.PropertyInfraConfiguration'
        type: array
      modules:
        items:
          type: string
        type: array
      property_id:
        type: string
    type: object
  orchestrator_dtos.SetupOrgPropertyReqDTO:
    properties:
      accuracy_m:
        type: integer
      address_line:
        type: string
      city:
        type: string
      country:
        type: string
      latitude:
        type: number
      longitude:
        description: Optional geolocation fields to capture the organization's location
          for location-based services and analytics.
        type: number
      name:
        type: string
      pincode:
        type: string
      property_code:
        type: string
      state:
        type: string
      step_id:
        type: string
    required:
    - step_id
    type: object
  org_customer_models.Customer:
    properties:
      email:
        type: string
      gstin:
        type: string
      id:
        type: string
      name:
        type: string
      organizationID:
        type: string
      phone:
        type: string
    type: object
  org_signup_dtos.OrganizationRegistrationDTO:
    description: Organization Registration Data
    properties:
      email:
        type: string
      mobile:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - mobile
    - password
    type: object
  property_constants.PropertyDomainTypes:
    enum:
    - HOSPITALITY
    - EDUCATION
    - MEDICAL_SCIENCE
    type: string
    x-enum-varnames:
    - Hospitality
    - Education
    - MedicalScience
  utils.APIError:
    properties:
      code:
        type: string
      message:
        type: string
      status:
        type: integer
    type: object
  utils.Response:
    description: Global API Response Wrapper
    properties:
      data: {}
      error:
        $ref: '#/definitions/utils.APIError'
      message:
        type: string
      success:
        type: boolean
      timestamp:
        type: string
      token:
        type: string
    type: object
host: api.sharpnr.test
info:
  contact:
    email: support@sharpnr.com
    name: API Support
    url: http://www.sharpnr.com/support
  description: Sharpnr Engine API Documentation
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Sharpnr Engine APIs
  version: "1.0"
paths:
  /hospitality/bar:
    get:
      consumes:
      - application/json
      description: Retrieves bar information linked to the authenticated organization
        UUID.
      produces:
      - application/json
      responses:
        "200":
          description: Bar details retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid organization UUID format
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Organization UUID missing
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No bar found for this organization
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to fetch bar details
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get bar details for the current organization
      tags:
      - Hospitality - Bar
  /orchestrator/org/customers/add:
    post:
      consumes:
      - application/json
      description: this Api Create Customer in the Organization as of Now this API
        Can be used Business Logic Modules To Create Customer, in Future We will Inject
        this service in business logic module
      parameters:
      - description: Session cookie containing org_id
        in: header
        name: Cookie
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  type: boolean
              type: object
        "400":
          description: Validation Error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Create Customer in the Organization
      tags:
      - Orchestrator.Customers
  /orchestrator/org/customers/search:
    get:
      consumes:
      - application/json
      description: Searches customers within the current organization using a partial
        name or identifier. Minimum 3 characters required.
      parameters:
      - description: Session cookie containing org_id and empl_id
        in: header
        name: Cookie
        required: true
        type: string
      - description: Search query (minimum 3 characters)
        in: query
        name: searchQuery
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Customers fetched successfully
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/org_customer_models.Customer'
                  type: array
              type: object
        "400":
          description: Invalid search query
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Search customers inside organization
      tags:
      - Orchestrator.Customers
  /orchestrator/property:
    get:
      consumes:
      - application/json
      description: Fetches all properties belonging to the current organization, scoped
        to the authenticated employee.
      parameters:
      - description: Session cookie containing org_id and empl_id
        in: header
        name: Cookie
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Properties fetch successfully
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: List all properties of the organization
      tags:
      - Orchestrator.Properties
  /orchestrator/property/{propertyID}:
    get:
      consumes:
      - application/json
      description: Fetches the full details of a single property belonging to the
        current organization.
      parameters:
      - description: Session cookie containing org_id
        in: header
        name: Cookie
        required: true
        type: string
      - description: Property ID (UUID)
        in: path
        name: propertyID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Property details fetch successfully
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Invalid property ID
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Get property details
      tags:
      - Orchestrator.Properties
  /orchestrator/property/{propertyID}/add-infra:
    post:
      consumes:
      - application/json
      description: Adds infrastructure (e.g. rooms, tables) of a given type and quantity
        to a property.
      parameters:
      - description: Session cookie containing org_id
        in: header
        name: Cookie
        required: true
        type: string
      - description: Property ID (UUID)
        in: path
        name: propertyID
        required: true
        type: string
      - description: Infrastructure configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/orchestrator_dtos.PropertyInfraConfiguration'
      produces:
      - application/json
      responses:
        "200":
          description: Result
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Validation Error
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Add infrastructure to a property
      tags:
      - Orchestrator.Properties
  /orchestrator/property/{propertyID}/add-modules:
    post:
      consumes:
      - application/json
      description: Attaches one or more business modules (and optional infrastructure)
        to a property. Returns the created and skipped modules.
      parameters:
      - description: Session cookie containing org_id
        in: header
        name: Cookie
        required: true
        type: string
      - description: Property ID (UUID)
        in: path
        name: propertyID
        required: true
        type: string
      - description: Module configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/orchestrator_dtos.PropertyModuleConfigurationDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Result
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/orchestrator_dtos.ModuleOperationResult'
              type: object
        "400":
          description: Validation Error / module constraint conflict
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Add modules to a property
      tags:
      - Orchestrator.Properties
  /orchestrator/property/{propertyID}/infra:
    get:
      consumes:
      - application/json
      description: Fetches all infrastructure configured for a property within the
        current organization.
      parameters:
      - description: Session cookie containing org_id
        in: header
        name: Cookie
        required: true
        type: string
      - description: Property ID (UUID)
        in: path
        name: propertyID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Property Infra fetched successfully
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/orchestrator_dtos.ListAllInfraOfProperty_Res_dto'
              type: object
        "400":
          description: Invalid property ID
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Get property infrastructure
      tags:
      - Orchestrator.Properties
  /orchestrator/property/create:
    post:
      consumes:
      - application/json
      description: Creates a new property under the current organization.
      parameters:
      - description: Session cookie containing org_id
        in: header
        name: Cookie
        required: true
        type: string
      - description: Property details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/orchestrator_dtos.CreatePropertyReq_dto'
      produces:
      - application/json
      responses:
        "200":
          description: Property Created Successfully
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Validation Error
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Create a property
      tags:
      - Orchestrator.Properties
  /orchestrator/setup-wizard/progress:
    get:
      consumes:
      - application/json
      description: Detailed explanation of what happens (e.g., database changes, emails
        sent).
      produces:
      - application/json
      responses:
        "200":
          description: Complete" "Success message
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Validation Error
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Short, punchy summary of the action
      tags:
      - CategoryName (e.g.
      - accounting-ap)
  /orchestrator/setup-wizard/step2:
    post:
      consumes:
      - application/json
      description: 'Second step of the onboarding wizard: Configures the core property
        attributes for the organization.'
      parameters:
      - description: Property Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/orchestrator_dtos.SetupOrgPropertyReqDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Property Added Successfully
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Validation Error
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Setup Organization Property
      tags:
      - core-setup
  /signup/initiate:
    post:
      consumes:
      - application/json
      description: Validates the request and starts the registration process.
      parameters:
      - description: Details
        in: body
        name: registration
        required: true
        schema:
          $ref: '#/definitions/org_signup_dtos.OrganizationRegistrationDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully initiated registration
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Validation Error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Initiate Organization Registration
      tags:
      - signup
schemes:
- http
- https
swagger: "2.0"
