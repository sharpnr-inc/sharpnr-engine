definitions:
  dto.OrgInitialRegistration_Request_Dto:
    properties:
      description:
        type: string
      email:
        type: string
      name:
        type: string
      orgType:
        type: string
      password:
        type: string
      phone:
        type: string
    type: object
  dto.OrgInitialRegistration_Response_Dto:
    properties:
      message:
        type: string
      token:
        type: string
    type: object
  dto.OrgVerifyOTP_Req_Dto:
    properties:
      otp:
        type: string
    type: object
  dto.OrgVerifyOTP_Res_Dto:
    properties:
      created_at:
        type: integer
      description:
        type: string
      master_contact:
        type: string
      message:
        type: string
      name:
        type: string
      org_operation_type:
        type: string
      root_email:
        type: string
      sharpnr_org_id:
        type: string
    type: object
info:
  contact: {}
paths:
  /org/register:
    post:
      consumes:
      - application/json
      description: Start the registration process for a new organization
      parameters:
      - description: Organization registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OrgInitialRegistration_Request_Dto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OrgInitialRegistration_Response_Dto'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new organization
      tags:
      - Registration
  /org/reset-password:
    get:
      consumes:
      - application/json
      description: Reset the password for an existing organization
      parameters:
      - description: Organization email
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset organization password
      tags:
      - Auth
  /org/verify-email-otp:
    post:
      consumes:
      - application/json
      description: Verifies OTP sent during registration
      parameters:
      - description: OTP verification payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OrgVerifyOTP_Req_Dto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OrgVerifyOTP_Res_Dto'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify organization email with OTP
      tags:
      - Registration
swagger: "2.0"
