basePath: /api/v1
definitions:
  org_signup_dtos.OrganizationRegistrationDTO:
    description: Organization Registration Data
    properties:
      email:
        type: string
      mobile:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - mobile
    - password
    type: object
  utils.APIError:
    properties:
      code:
        type: string
      message:
        type: string
      status:
        type: integer
    type: object
  utils.Response:
    description: Global API Response Wrapper
    properties:
      data: {}
      error:
        $ref: '#/definitions/utils.APIError'
      message:
        type: string
      success:
        type: boolean
      timestamp:
        type: string
      token:
        type: string
    type: object
host: 192.168.1.35:8080
info:
  contact:
    email: support@sharpnr.com
    name: API Support
    url: http://www.sharpnr.com/support
  description: Sharpnr Engine API Documentation
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Sharpnr Engine APIs
  version: "1.0"
paths:
  /hospitality/bar:
    get:
      consumes:
      - application/json
      description: Retrieves bar information linked to the authenticated organization
        UUID.
      produces:
      - application/json
      responses:
        "200":
          description: Bar details retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid organization UUID format
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Organization UUID missing
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No bar found for this organization
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to fetch bar details
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get bar details for the current organization
      tags:
      - Hospitality - Bar
  /org/register:
    post:
      consumes:
      - application/json
      description: Validates the request and starts the registration process.
      parameters:
      - description: Details
        in: body
        name: registration
        required: true
        schema:
          $ref: '#/definitions/org_signup_dtos.OrganizationRegistrationDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully initiated registration
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Validation Error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Initiate Organization Registration
      tags:
      - signup
swagger: "2.0"
