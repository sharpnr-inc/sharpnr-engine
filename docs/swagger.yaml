basePath: /api/v1
definitions:
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.OrganisationRegisterDTO:
    properties:
      address:
        type: string
      adminName:
        type: string
      bankAccNumber:
        type: string
      bankBranchName:
        type: string
      banker:
        type: string
      cinNumber:
        type: string
      email:
        type: string
      gstNumber:
        type: string
      ifscCode:
        type: string
      isPhysicalVerified:
        description: optional, pointer so omitted if nil
        type: boolean
      isRegistered:
        type: boolean
      name:
        type: string
      organizationID:
        type: string
      organizationRegType:
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: integer
    required:
    - adminName
    - bankAccNumber
    - email
    - name
    - organizationID
    - password
    - phone
    type: object
host: localhost:8080
info:
  contact:
    email: support@sharpnr.com
    name: API Support
  description: Backend APIs for SharpNR system.
  termsOfService: http://sharpnr.com/terms/
  title: SharpNR API
  version: "1.0"
paths:
  /organization/login:
    post:
      consumes:
      - application/json
      description: Logs in an organization and returns JWT
      parameters:
      - description: Login Credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login for organization root
      tags:
      - Organization
  /organization/register:
    post:
      consumes:
      - application/json
      description: This is Registration for the Organisation
      parameters:
      - description: Login Credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/dto.OrganisationRegisterDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register for organization Registration
      tags:
      - Organization
swagger: "2.0"
