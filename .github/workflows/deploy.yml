name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
      - alpha-release
      - beta-release
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  EB_APPLICATION_NAME: sharpnr-engine
  GOMODCACHE: ${{ github.workspace }}/.gomodcache

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21" # Use stable version

      - name: Clean Go modules cache before restore
        run: |
          sudo chmod -R u+w $GOMODCACHE || true
          sudo rm -rf $GOMODCACHE

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest

      - name: Fix permissions for Go modules (post-job cleanup)
        if: always()
        run: |
          sudo chown -R $(whoami) $GOMODCACHE || true

  deploy-alpha:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/alpha-release' && github.event_name == 'push'
    env:
      GOMODCACHE: ${{ github.workspace }}/.gomodcache

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Clean Go modules cache before build
        run: |
          sudo chmod -R u+w $GOMODCACHE || true
          sudo rm -rf $GOMODCACHE

      - name: Install dependencies
        run: go mod download

      - name: Build application
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o application ./cmd/server

      - name: Create Procfile
        run: |
          echo "web: ./application" > Procfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Copy Alpha DB Config
        run: |
          cp .ebextensions/02_database_alpha.config .ebextensions/02_database.config

      - name: Validate deployment package
        run: |
          echo "Checking required files..."
          ls -la
          if [ ! -f "application" ]; then echo "ERROR: application binary not found"; exit 1; fi
          if [ ! -f "Procfile" ]; then echo "ERROR: Procfile not found"; exit 1; fi
          echo "Files validated successfully"

      - name: Create deployment package
        run: |
          zip -r deploy.zip . -x "*.git*" "*.github*" "tests/*" "*.md" "*.log"

      - name: Deploy to Alpha Environment
        run: |
          # Upload to S3
          aws s3 cp deploy.zip s3://sharpnr-engine-deployment/alpha-${{ github.sha }}.zip

          # Create application version
          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --version-label alpha-${{ github.sha }} \
            --source-bundle S3Bucket=sharpnr-engine-deployment,S3Key=alpha-${{ github.sha }}.zip \
            --description "Alpha deployment from commit ${{ github.sha }}"

          # Update environment
          aws elasticbeanstalk update-environment \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-name ${{ secrets.EB_ENVIRONMENT_ALPHA }} \
            --version-label alpha-${{ github.sha }}

          # Wait for deployment to complete
          aws elasticbeanstalk wait environment-updated \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-names ${{ secrets.EB_ENVIRONMENT_ALPHA }}

  deploy-beta:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/beta-release' && github.event_name == 'push'
    env:
      GOMODCACHE: ${{ github.workspace }}/.gomodcache

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Clean Go modules cache before build
        run: |
          sudo chmod -R u+w $GOMODCACHE || true
          sudo rm -rf $GOMODCACHE

      - name: Install dependencies
        run: go mod download

      - name: Build application
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o application ./cmd/server

      - name: Create Procfile
        run: |
          echo "web: ./application" > Procfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Copy Beta DB Config
        run: |
          cp .ebextensions/02_database_beta.config .ebextensions/02_database.config

      - name: Validate deployment package
        run: |
          echo "Checking required files..."
          ls -la
          if [ ! -f "application" ]; then echo "ERROR: application binary not found"; exit 1; fi
          if [ ! -f "Procfile" ]; then echo "ERROR: Procfile not found"; exit 1; fi
          echo "Files validated successfully"

      - name: Create deployment package
        run: |
          zip -r deploy.zip . -x "*.git*" "*.github*" "tests/*" "*.md" "*.log"

      - name: Deploy to Beta Environment
        run: |
          aws s3 cp deploy.zip s3://${{ secrets.S3_BUCKET }}/beta-${{ github.sha }}.zip

          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --version-label beta-${{ github.sha }} \
            --source-bundle S3Bucket=${{ secrets.S3_BUCKET }},S3Key=beta-${{ github.sha }}.zip \
            --description "Beta deployment from commit ${{ github.sha }}"

          aws elasticbeanstalk update-environment \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-name ${{ secrets.EB_ENVIRONMENT_BETA }} \
            --version-label beta-${{ github.sha }}

          aws elasticbeanstalk wait environment-updated \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-names ${{ secrets.EB_ENVIRONMENT_BETA }}

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      GOMODCACHE: ${{ github.workspace }}/.gomodcache

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Clean Go modules cache before build
        run: |
          sudo chmod -R u+w $GOMODCACHE || true
          sudo rm -rf $GOMODCACHE

      - name: Install dependencies
        run: go mod download

      - name: Build application
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o application ./cmd/server

      - name: Create Procfile
        run: |
          echo "web: ./application" > Procfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Copy Production DB Config
        run: |
          cp .ebextensions/02_database_prod.config .ebextensions/02_database.config

      - name: Validate deployment package
        run: |
          echo "Checking required files..."
          ls -la
          if [ ! -f "application" ]; then echo "ERROR: application binary not found"; exit 1; fi
          if [ ! -f "Procfile" ]; then echo "ERROR: Procfile not found"; exit 1; fi
          echo "Files validated successfully"

      - name: Create deployment package
        run: |
          zip -r deploy.zip . -x "*.git*" "*.github*" "tests/*" "*.md" "*.log"

      - name: Deploy to Production Environment
        run: |
          aws s3 cp deploy.zip s3://${{ secrets.S3_BUCKET }}/prod-${{ github.sha }}.zip

          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --version-label prod-${{ github.sha }} \
            --source-bundle S3Bucket=${{ secrets.S3_BUCKET }},S3Key=prod-${{ github.sha }}.zip \
            --description "Production deployment from commit ${{ github.sha }}"

          aws elasticbeanstalk update-environment \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-name ${{ secrets.EB_ENVIRONMENT_PROD }} \
            --version-label prod-${{ github.sha }}

          aws elasticbeanstalk wait environment-updated \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-names ${{ secrets.EB_ENVIRONMENT_PROD }}
