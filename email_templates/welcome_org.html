{{template "base_layout.html" .}}

{{define "content"}}
<!-- Badge -->
<p style="display:inline-block;background:#EEF0FA;color:#0A0A2E;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:5px;margin:0 0 16px;">Welcome</p>

<p style="color:#5A607A;font-size:15px;line-height:1.7;margin:0 0 20px;">Hi <strong style="color:#0A0A2E;">{{.Name}}</strong>,</p>

<p style="color:#3D4560;font-size:14px;margin:6px 0;">
  <strong style="color:#0A0A2E;">Email:</strong> {{.Email}}
</p>

<p style="color:#3D4560;font-size:14px;margin:6px 0;">
  <strong style="color:#0A0A2E;">OrganizationName:</strong> {{.OrganizationName}}
</p>

{{if .ActionURL}}
<table cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:24px 0 8px;">
  <tr>
    <td align="center">
      <a href="{{.ActionURL}}" style="display:inline-block;background-color:#0A0A2E;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;padding:14px 36px;border-radius:8px;line-height:1;">{{.ActionText}}</a>
    </td>
  </tr>
</table>
{{end}}
{{end}}
