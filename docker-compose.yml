version: "3.9"

services:
  backend:
    build: .
    container_name: sharpnr_backend
    ports:
      - "8080:8080"
    env_file:
      - .env.production
    environment:
      APP_ENV: production
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:16
    container_name: sharpnr_postgres
    restart: always
    environment:
      POSTGRES_USER: sharpnr
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: sharpnr_dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sharpnr_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
