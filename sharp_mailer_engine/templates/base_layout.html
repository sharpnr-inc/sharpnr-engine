{{define "base_layout.html"}}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sharpnr</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui,
        sans-serif;
    "
  >
    <table cellpadding="0" cellspacing="0" border="0" width="100%">
      <tr>
        <td align="center" style="padding: 40px 20px">
          <table
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 480px;
              width: 100%;
              background: #ffffff;
              border-radius: 16px;
              box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            "
          >
            <tr>
              <td
                style="
                  background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
                  padding: 40px 30px;
                  text-align: center;
                  border-radius: 16px 16px 0 0;
                "
              >
                <h1
                  style="
                    color: #ffffff;
                    font-size: 24px;
                    font-weight: 700;
                    margin: 0;
                    letter-spacing: -0.5px;
                  "
                >
                  Sharpnr
                </h1>
              </td>
            </tr>

            <tr>
              <td style="padding: 50px 40px">{{block "content" .}}{{end}}</td>
            </tr>

            <tr>
              <td
                style="
                  background: #f9fafb;
                  padding: 25px 40px;
                  text-align: center;
                  border-radius: 0 0 16px 16px;
                  border-top: 1px solid #e5e7eb;
                "
              >
                <p style="color: #9ca3af; font-size: 12px; margin: 0">
                  © 2026 Sharpnr. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
{{end}}
