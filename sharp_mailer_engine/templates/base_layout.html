<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Sharpnr</title>
    <!--[if mso]>
      <noscript
        ><xml
          ><o:OfficeDocumentSettings
            ><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings

  <body
    style="

      padding: 0;
      background-color: #eaedf5;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      mso-line-height-rule: exactly;
    "
  >
    <!-- OUTER WRAPPER -->
    <table
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      style="background-color: #eaedf5"
    >
      <tr>
        <td align="center" style="padding: 44px 16px 52px">
          <!-- EMAIL CARD -->
          <table
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 500px;
              width: 100%;
              background: #ffffff;
              border-radius: 14px;
              overflow: hidden;
              box-shadow:
                0 4px 28px rgba(10, 10, 46, 0.14),
                0 1px 4px rgba(10, 10, 46, 0.06);
            "
          >
            <!-- HEADER -->
            <tr>
              <td
                style="
                  background-color: #0a0a2e;
                  padding: 26px 36px;
                  border-radius: 14px 14px 0 0;
                "
              >
                <table cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="vertical-align: middle">
                      <table cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td
                            style="
                              width: 38px;
                              height: 38px;
                              border: 1px solid rgba(255, 255, 255, 0.18);
                              border-radius: 9px;
                              text-align: center;
                              vertical-align: middle;
                              background-color: #0a0a2e;
                            "
                          >

                              width="22"
                              height="22"
                              alt="Sharpnr"
                              style="
                                display: block;
                                margin: 8px auto;
                                border: 0;
                              "
                            />
                          </td>
                        </tr>
                      </table>
                    </td>
                    <td style="padding-left: 11px; vertical-align: middle">
                      <span
                        style="
                          color: #ffffff;
                          font-size: 19px;
                          font-weight: 700;
                          letter-spacing: -0.5px;
                          line-height: 1;
                        "
                        >Sharpnr</span
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <!-- /HEADER -->

            <!-- CONTENT SLOT -->
            <tr>
              <td style="padding: 44px 36px 36px">
                {{block "content" .}}{{end}}
              </td>
            </tr>
            <!-- /CONTENT SLOT -->

            <!-- FOOTER -->
            <tr>
              <td
                style="
                  background-color: #f7f8fc;
                  border-top: 1px solid #eef0f8;
                  padding: 20px 36px 22px;
                  border-radius: 0 0 14px 14px;
                "
              >
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td align="center" style="padding-bottom: 9px">
                      <a
                        href="#"
                        style="
                          color: #9ca3c0;
                          font-size: 11px;
                          text-decoration: none;
                          margin: 0 8px;
                        "
                        >Unsubscribe</a
                      >
                      <span style="color: #d1d5e8; font-size: 11px">·</span>
                      <a
                        href="#"
                        style="
                          color: #9ca3c0;
                          font-size: 11px;
                          text-decoration: none;
                          margin: 0 8px;
                        "
                        >Privacy Policy</a
                      >
                      <span style="color: #d1d5e8; font-size: 11px">·</span>
                      <a
                        href="#"
                        style="
                          color: #9ca3c0;
                          font-size: 11px;
                          text-decoration: none;
                          margin: 0 8px;
                        "

                      >

                  </tr>
                  <tr>
                    <td align="center">
                      <p
                        style="
                          color: #c4c9dc;
                          font-size: 11px;
                          line-height: 1.6;
                          margin: 0;

                        You received this because you have an account with us.
                      </p>
                    </td>
                  </tr>

              </td>

          <!-- /EMAIL CARD -->
        </td>
      </tr>
