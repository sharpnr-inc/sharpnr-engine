{{define "notification.html"}}
{{template "base_layout.html" .}}
{{end}}

{{define "content"}}
<div style="text-align: center; margin-bottom: 36px">
    <h2 style="
      color: #1f2937;
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 10px;
      line-height: 1.3;
    ">
        {{.Title}}
    </h2>

    {{if .Subtitle}}
    <p style="
      color: #6b7280;
      font-size: 16px;
      margin: 0;
      line-height: 1.5;
    ">
        {{.Subtitle}}
    </p>
    {{end}}
</div>

<div style="
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 28px;
    margin: 28px 0;
  ">
    <p style="
      color: #374151;
      font-size: 15px;
      line-height: 1.6;
      margin: 0;
    ">
        {{.Message}}
    </p>
</div>

{{if .ActionURL}}
<div style="text-align: center; margin-top: 30px">
    <a href="{{.ActionURL}}" style="
      display: inline-block;
      background: #6366f1;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 8px;
    ">
        {{.ActionText}}
    </a>
</div>
{{end}}

{{if .FooterNote}}
<p style="
    margin-top: 30px;
    color: #9ca3af;
    font-size: 12px;
    text-align: center;
    line-height: 1.4;
  ">
    {{.FooterNote}}
</p>
{{end}}
{{end}}
