{{define "otp.html"}} {{template "base_layout.html" .}} {{end}} {{define
"content"}}
<div style="text-align: center; margin-bottom: 40px">
  <h2
    style="
      color: #1f2937;
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 12px;
      line-height: 1.3;
    "
  >
    Verify Your Organization
  </h2>
  <p style="color: #6b7280; font-size: 16px; margin: 0; line-height: 1.5">
    Enter this verification code to complete your registration:
  </p>
</div>

<div
  style="
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    margin: 30px 0;
  "
>
  <div
    style="
      background: #ffffff;
      border: 2px solid #6366f1;
      border-radius: 8px;
      padding: 16px;
      display: inline-block;
    "
  >
    <span
      style="
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 6px;
        color: #6366f1;
        font-family: 'Courier New', monospace;
      "
      >{{.Code}}</span
    >
  </div>
  <p
    style="
      color: #94a3b8;
      font-size: 12px;
      margin: 15px 0 0;
      font-style: italic;
    "
  >
    Expires in {{.Expiry}}
  </p>
</div>
{{end}}
