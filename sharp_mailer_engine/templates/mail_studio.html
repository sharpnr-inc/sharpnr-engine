<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sharpnr — Mail Studio</title>
  <link rel="stylesheet" href="mail_studio.css" />
</head>
<body>

<div class="app">

  <!-- ── TOPBAR ── -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 8h10M8 3v10" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="logo-text">Sharpnr</span>
      </div>
      <div class="divider-v"></div>
      <span class="studio-label">mail studio</span>
    </div>
    <div class="topbar-right">
      <span class="saved-pill" id="savedPill">saved</span>
      <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle dark mode">
        <svg id="themeIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── MAIN ── -->
  <div class="main">

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar">
      <div class="panel-head">
        <span class="panel-label">templates</span>
      </div>
      <div class="tpl-list" id="tplList"></div>
      <button class="add-tpl-btn" id="addTplBtn">+ new template</button>
    </aside>

    <!-- ── VARS PANEL ── -->
    <section class="vars-panel">
      <div class="panel-head">
        <span class="panel-label">variables</span>
      </div>
      <div class="vars-scroll" id="varsForm"></div>
    </section>

    <!-- ── PREVIEW PANEL ── -->
    <section class="preview-panel">
      <div class="preview-toolbar">
        <div class="preview-tabs">
          <button class="ptab active" data-tab="preview">preview</button>
          <button class="ptab" data-tab="code">html source</button>
          <button class="ptab" data-tab="gotpl">go template</button>
        </div>
        <div class="preview-actions">
          <button class="action-btn" id="copyBtn">copy</button>
          <button class="action-btn primary" id="saveBtn">save to templates</button>
        </div>
      </div>

      <!-- Preview -->
      <div class="preview-wrap" id="previewWrap">
        <iframe id="previewFrame" sandbox="allow-same-origin allow-scripts" title="Email preview"></iframe>
      </div>

      <!-- Rendered HTML source -->
      <div class="preview-wrap hidden" id="codeWrap">
        <pre id="codeView"></pre>
      </div>

      <!-- Go template source -->
      <div class="preview-wrap hidden" id="gotplWrap">
        <pre id="gotplView"></pre>
      </div>
    </section>

  </div>
</div>

<!-- ── NEW TEMPLATE MODAL ── -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-title" id="modalTitle">New template</div>

    <div class="modal-field">
      <label class="modal-label" for="newTplName">template name</label>
      <input
        class="modal-input"
        id="newTplName"
        type="text"
        placeholder="e.g. welcome, reset_password"
        autocomplete="off"
        spellcheck="false"
      />
      <div class="error-msg" id="nameError"></div>
    </div>

    <div class="modal-field">
      <span class="modal-label">variable fields</span>
      <div class="chips-wrap" id="fieldChips"></div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" id="modalCancel">cancel</button>
      <button class="btn-create" id="modalCreate">create template</button>
    </div>
  </div>
</div>

<script src="mail_studio.js"></script>
</body>
</html>
